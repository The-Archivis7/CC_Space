<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure - Multi-Boss Bloom Edition</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --accent: #00e5ff;
            --danger: #ff5252;
            --bg-glass: rgba(10, 15, 30, 0.88);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #02040a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.25);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.3);
            width: 800px;
            height: 600px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Overlay --- */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        #lives {
            color: var(--danger);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
        }

        button {
            pointer-events: auto;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ui {
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .btn-ui:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.9);
        }

        /* --- Overlays & Modals --- */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 24px 32px;
            color: white;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 255, 0.2);
            display: none;
            z-index: 10;
            min-width: 340px;
        }

        #game-over-modal h1 {
            color: var(--danger);
            margin: 0 0 10px 0;
            font-size: 42px;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.8);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 28px;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.7);
        }

        #upgrade-menu h2 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .btn-upgrade {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .btn-upgrade:hover:not(:disabled) {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }

        .btn-upgrade:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cost-tag {
            background: rgba(0, 229, 255, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent);
        }

        #boss-warning {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            display: none;
            z-index: 6;
            text-align: center;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="stats-group">
                <div class="stat-item">Score: <span id="score">0</span></div>
                <div class="stat-item">Lives: <span id="lives">♥♥♥</span></div>
            </div>
            <button id="upgrade-btn" class="btn-ui">Upgrades (M)</button>
        </div>

        <div id="boss-warning">WARNING: BOSS APPROACHING</div>

        <div id="game-over-modal" class="modal">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart" class="btn-primary">Play Again</button>
        </div>

        <div id="upgrade-menu" class="modal">
            <h2>Hangar Upgrades</h2>
            <div class="upgrade-grid">
                <button class="btn-upgrade" data-upgrade="firingSpeed">
                    Firing Speed <span class="cost-tag">50 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="health">
                    +1 Extra Life <span class="cost-tag">100 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="movementSpeed">
                    Move Speed <span class="cost-tag">75 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="bulletSpeed">
                    Bullet Velocity <span class="cost-tag">80 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="shield">
                    Invincibility (5s) <span class="cost-tag">150 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="multiShot">
                    Spread Shot <span class="cost-tag">200 pts</span>
                </button>
            </div>
            <button id="close-upgrade" class="btn-primary" style="width: 100%;">Resume Mission</button>
        </div>
    </div>

    <script>
        // --- Game Bounds ---
        const BOUNDS = { width: 800, height: 600 };

        // --- UI References ---
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const upgradeMenu = document.getElementById('upgrade-menu');
        const closeUpgradeBtn = document.getElementById('close-upgrade');
        const bossWarningEl = document.getElementById('boss-warning');

        // --- State Variables ---
        let score = 0;
        let lives = 3;
        let maxLives = 3;
        let gameRunning = true;
        let lastShotTime = 0;
        let bulletCooldown = 200;
        let enemyBulletCooldown = 1800;
        let totalUpgrades = 0;
        let screenShakeTime = 0;

        const upgrades = {
            firingSpeed: { level: 0, cost: 50 },
            health: { level: 0, cost: 100 },
            movementSpeed: { level: 0, cost: 75 },
            bulletSpeed: { level: 0, cost: 80 },
            shield: { level: 0, cost: 150 },
            multiShot: { level: 0, cost: 200 }
        };

        let shieldActive = false;
        let shieldEndTime = 0;
        let baseBulletSpeed = 12;

        const keys = {};

        // --- Boss Sequence State ---
        let currentBossType = 0; // 0: Void Sentinel, 1: Cyber Dreadnought, 2: Cosmic Weaver
        let nextBossSpawnTime = Date.now() + 25000; // First boss spawns after 25s
        let bossSpawned = false;

        // --- Three.js & WebGL Bloom Setup ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02040a, 0.001);

        const camera = new THREE.OrthographicCamera(
            -BOUNDS.width / 2, BOUNDS.width / 2,
            BOUNDS.height / 2, -BOUNDS.height / 2,
            0.1, 1000
        );
        camera.position.z = 500;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(BOUNDS.width, BOUNDS.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // Bloom Post-Processing Pipeline
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(BOUNDS.width, BOUNDS.height),
            1.8,  // Bloom Strength
            0.4,  // Radius
            0.1   // Threshold
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Ambient Light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // --- Dynamic Background Starfield ---
        const starCount = 200;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSpeeds = [];

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * BOUNDS.width;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * BOUNDS.height;
            starPositions[i * 3 + 2] = -50 - Math.random() * 200;
            starSpeeds.push(1 + Math.random() * 3);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x88ccff, size: 2.5, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- Particle System for Explosions & Sparks ---
        const maxParticles = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(maxParticles * 3);
        const particleVelocities = [];
        const particleLifes = new Float32Array(maxParticles);
        const particleColors = new Float32Array(maxParticles * 3);

        for (let i = 0; i < maxParticles; i++) {
            particleVelocities.push(new THREE.Vector3());
            particleLifes[i] = 0;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 5,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        function triggerExplosion(x, y, colorHex = 0xffaa00, count = 25) {
            const positions = particleGeo.attributes.position.array;
            const colors = particleGeo.attributes.color.array;
            const c = new THREE.Color(colorHex);

            let spawned = 0;
            for (let i = 0; i < maxParticles && spawned < count; i++) {
                if (particleLifes[i] <= 0) {
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = 10;

                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 6;
                    particleVelocities[i].set(Math.cos(angle) * speed, Math.sin(angle) * speed, 0);

                    particleLifes[i] = 1.0;

                    colors[i * 3] = c.r * 2.0; // Boosted brightness for Bloom
                    colors[i * 3 + 1] = c.g * 2.0;
                    colors[i * 3 + 2] = c.b * 2.0;

                    spawned++;
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;
        }

        function updateParticles() {
            const positions = particleGeo.attributes.position.array;
            for (let i = 0; i < maxParticles; i++) {
                if (particleLifes[i] > 0) {
                    particleLifes[i] -= 0.03;
                    positions[i * 3] += particleVelocities[i].x;
                    positions[i * 3 + 1] += particleVelocities[i].y;

                    if (particleLifes[i] <= 0) {
                        positions[i * 3 + 1] = -9999;
                    }
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
        }

        // --- Player Ship Setup ---
        const player = {
            x: 0,
            y: -220,
            width: 44,
            height: 44,
            speed: 6,
            mesh: null,
            shieldMesh: null,
            thrusterMesh: null,
            innerFlameMesh: null
        };

        function createPlayerMesh() {
            const group = new THREE.Group();

            // Ship Main Body
            const bodyGeo = new THREE.ConeGeometry(22, 44, 4);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(bodyMesh);

            // Engine Core Glow
            const engineGeo = new THREE.SphereGeometry(8, 8, 8);
            const engineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const engineMesh = new THREE.Mesh(engineGeo, engineMat);
            engineMesh.position.y = -18;
            group.add(engineMesh);

            // --- ANIMATED THRUSTERS / BOOSTER ---
            const thrusterGeo = new THREE.ConeGeometry(6, 24, 8);
            thrusterGeo.rotateX(Math.PI); // Point downwards
            const thrusterMat = new THREE.MeshBasicMaterial({
                color: 0x00e5ff,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const thrusterMesh = new THREE.Mesh(thrusterGeo, thrusterMat);
            thrusterMesh.position.y = -28;
            group.add(thrusterMesh);

            // Inner Intense Thruster Flame Core
            const innerFlameGeo = new THREE.ConeGeometry(3, 16, 8);
            innerFlameGeo.rotateX(Math.PI);
            const innerFlameMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.95
            });
            const innerFlameMesh = new THREE.Mesh(innerFlameGeo, innerFlameMat);
            innerFlameMesh.position.y = -24;
            group.add(innerFlameMesh);

            // Shield Mesh
            const shieldGeo = new THREE.RingGeometry(28, 32, 32);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            shieldMesh.visible = false;
            group.add(shieldMesh);

            player.mesh = group;
            player.shieldMesh = shieldMesh;
            player.thrusterMesh = thrusterMesh;
            player.innerFlameMesh = innerFlameMesh;
            scene.add(group);
        }
        createPlayerMesh();

        // --- Entities Lists ---
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let boss = null;

        // --- Helper Functions ---
        function isColliding(rect1, rect2) {
            return rect1.x - rect1.width / 2 < rect2.x + rect2.width / 2 &&
                   rect1.x + rect1.width / 2 > rect2.x - rect2.width / 2 &&
                   rect1.y - rect1.height / 2 < rect2.y + rect2.height / 2 &&
                   rect1.y + rect1.height / 2 > rect2.y - rect2.height / 2;
        }

        // --- Firing Lasers ---
        function createPlayerLaser(x, y, vx = 0) {
            const geo = new THREE.PlaneGeometry(6, 20);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, 0);
            scene.add(mesh);

            bullets.push({
                x, y, width: 6, height: 20,
                vx, vy: baseBulletSpeed,
                mesh
            });
        }

        function createEnemyLaser(x, y, vx, vy, colorHex = 0xff0055, size = 10) {
            const geo = new THREE.SphereGeometry(size / 2, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, 0);
            scene.add(mesh);

            enemyBullets.push({
                x, y, width: size, height: size,
                vx, vy, mesh
            });
        }

        // ============================================================================
        // MULTI-BOSS CREATION ENGINE
        // ============================================================================
        function spawnBoss(typeIndex) {
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            const group = new THREE.Group();
            let name = "";
            let maxHealth = 2000;
            let width = 120;
            let height = 120;

            if (typeIndex === 0) {
                // --- BOSS 1: VOID SENTINEL (Octahedron & Energy Rings) ---
                name = "VOID SENTINEL";
                maxHealth = 2000;

                const frameGeo = new THREE.OctahedronGeometry(60, 0);
                const frameMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                const frameMesh = new THREE.Mesh(frameGeo, frameMat);
                group.add(frameMesh);

                const coreGeo = new THREE.SphereGeometry(30, 16, 16);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                group.add(coreMesh);

                const ringGeo = new THREE.TorusGeometry(85, 3, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                group.add(ringMesh);

                const beamGeo = new THREE.PlaneGeometry(30, BOUNDS.height);
                const beamMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0 });
                const beamMesh = new THREE.Mesh(beamGeo, beamMat);
                beamMesh.position.y = -BOUNDS.height / 2;
                group.add(beamMesh);

                boss = {
                    type: 0, name, x: 0, y: 180, width, height, health: maxHealth, maxHealth,
                    phase: 1, group, frameMesh, coreMesh, ringMesh, beamMesh,
                    lastAttack: Date.now(), attackTimer: 0, beamCharging: false, beamFiring: false, vx: 2.5
                };

            } else if (typeIndex === 1) {
                // --- BOSS 2: CYBER DREADNOUGHT (Heavy Armored Gunship) ---
                name = "CYBER DREADNOUGHT";
                maxHealth = 3200;
                width = 160; height = 100;

                // Main Armor Hull
                const hullGeo = new THREE.BoxGeometry(140, 50, 30);
                const hullMat = new THREE.MeshBasicMaterial({ color: 0x7c3aed });
                const hullMesh = new THREE.Mesh(hullGeo, hullMat);
                group.add(hullMesh);

                // Twin Wing Heavy Cannons
                const cannonGeo = new THREE.CylinderGeometry(8, 12, 60);
                const cannonMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
                const leftCannon = new THREE.Mesh(cannonGeo, cannonMat);
                leftCannon.position.set(-65, -10, 0);
                const rightCannon = new THREE.Mesh(cannonGeo, cannonMat);
                rightCannon.position.set(65, -10, 0);
                group.add(leftCannon);
                group.add(rightCannon);

                // Glowing Reactor Core
                const coreGeo = new THREE.BoxGeometry(30, 30, 35);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                group.add(coreMesh);

                boss = {
                    type: 1, name, x: 0, y: 180, width, height, health: maxHealth, maxHealth,
                    phase: 1, group, hullMesh, leftCannon, rightCannon, coreMesh,
                    lastAttack: Date.now(), attackTimer: 0, vx: 3.5, dashTargetX: 0
                };

            } else if (typeIndex === 2) {
                // --- BOSS 3: COSMIC WEAVER (Icosahedron Core + Satellites) ---
                name = "COSMIC WEAVER";
                maxHealth = 4500;
                width = 140; height = 140;

                // Central Nexus
                const coreGeo = new THREE.IcosahedronGeometry(45, 0);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0xff00aa, wireframe: true });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                group.add(coreMesh);

                const innerGeo = new THREE.SphereGeometry(25, 16, 16);
                const innerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const innerMesh = new THREE.Mesh(innerGeo, innerMat);
                group.add(innerMesh);

                // 3 Orbiting Satellites (Drones)
                const drones = [];
                for (let i = 0; i < 3; i++) {
                    const droneGeo = new THREE.DodecahedronGeometry(12);
                    const droneMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
                    const droneMesh = new THREE.Mesh(droneGeo, droneMat);
                    group.add(droneMesh);
                    drones.push(droneMesh);
                }

                boss = {
                    type: 2, name, x: 0, y: 170, width, height, health: maxHealth, maxHealth,
                    phase: 1, group, coreMesh, innerMesh, drones,
                    lastAttack: Date.now(), attackTimer: 0, vx: 2.0, droneAngle: 0
                };
            }

            scene.add(group);

            bossWarningEl.textContent = `WARNING: ${name} APPROACHING`;
            bossWarningEl.style.display = 'block';
            setTimeout(() => { bossWarningEl.style.display = 'none'; }, 3000);
            bossSpawned = true;
        }

        // ============================================================================
        // BOSS UPDATE & BEHAVIOR CONTROLLER
        // ============================================================================
        function updateBoss() {
            if (!boss) return;
            const now = Date.now();

            // --- BOSS 1: VOID SENTINEL BEHAVIOR ---
            if (boss.type === 0) {
                boss.x += boss.vx;
                if (Math.abs(boss.x) > 280) boss.vx *= -1;

                boss.group.position.set(boss.x, boss.y, 0);
                boss.ringMesh.rotation.z += 0.03;
                boss.frameMesh.rotation.y += 0.02;

                const healthRatio = boss.health / boss.maxHealth;
                if (healthRatio < 0.65 && boss.phase === 1) {
                    boss.phase = 2;
                    boss.coreMesh.material.color.setHex(0xffaa00);
                    triggerExplosion(boss.x, boss.y, 0xffaa00, 60);
                } else if (healthRatio < 0.3 && boss.phase === 2) {
                    boss.phase = 3;
                    boss.coreMesh.material.color.setHex(0xff0000);
                    boss.vx *= 1.5;
                    triggerExplosion(boss.x, boss.y, 0xff0000, 80);
                }

                if (now - boss.lastAttack > (boss.phase === 3 ? 600 : 1100)) {
                    boss.attackTimer++;
                    if (boss.phase === 1) {
                        const count = 8;
                        for (let i = 0; i < count; i++) {
                            const angle = (boss.attackTimer * 0.2) + (i * Math.PI * 2 / count);
                            createEnemyLaser(boss.x, boss.y, Math.cos(angle) * 4, Math.sin(angle) * 4, 0x00e5ff, 12);
                        }
                    } else if (boss.phase === 2) {
                        if (boss.attackTimer % 3 === 0) {
                            boss.beamCharging = true;
                            let chargeProgress = 0;
                            const chargeInterval = setInterval(() => {
                                chargeProgress += 0.1;
                                boss.beamMesh.material.opacity = chargeProgress * 0.4;
                                if (chargeProgress >= 1) {
                                    clearInterval(chargeInterval);
                                    boss.beamFiring = true;
                                    boss.beamMesh.material.opacity = 0.9;
                                    boss.beamMesh.material.color.setHex(0xff0055);
                                    screenShakeTime = 20;

                                    setTimeout(() => {
                                        boss.beamFiring = false;
                                        boss.beamCharging = false;
                                        boss.beamMesh.material.opacity = 0;
                                        boss.beamMesh.material.color.setHex(0xff0000);
                                    }, 1200);
                                }
                            }, 100);
                        } else {
                            for (let i = -2; i <= 2; i += 2) {
                                createEnemyLaser(boss.x + i * 20, boss.y, i * 1.5, -5, 0xffaa00, 14);
                            }
                        }
                    } else if (boss.phase === 3) {
                        const count = 14;
                        for (let i = 0; i < count; i++) {
                            const angle = (i * Math.PI * 2 / count) + Math.random() * 0.2;
                            createEnemyLaser(boss.x, boss.y, Math.cos(angle) * 5.5, Math.sin(angle) * 5.5, 0xff0055, 10);
                        }
                    }
                    boss.lastAttack = now;
                }

                if (boss.beamFiring && Math.abs(player.x - boss.x) < 25 && !shieldActive) {
                    registerPlayerHit();
                }

            // --- BOSS 2: CYBER DREADNOUGHT BEHAVIOR ---
            } else if (boss.type === 1) {
                boss.x += boss.vx;
                if (Math.abs(boss.x) > 260) boss.vx *= -1;

                boss.group.position.set(boss.x, boss.y, 0);

                const healthRatio = boss.health / boss.maxHealth;
                if (healthRatio < 0.6 && boss.phase === 1) {
                    boss.phase = 2;
                    boss.coreMesh.material.color.setHex(0xff0055);
                    triggerExplosion(boss.x, boss.y, 0x7c3aed, 60);
                } else if (healthRatio < 0.3 && boss.phase === 2) {
                    boss.phase = 3;
                    boss.coreMesh.material.color.setHex(0xffea00);
                    boss.vx *= 1.4;
                    triggerExplosion(boss.x, boss.y, 0xffea00, 80);
                }

                if (now - boss.lastAttack > (boss.phase === 3 ? 500 : 900)) {
                    boss.attackTimer++;
                    if (boss.phase === 1) {
                        // Twin Heavy Gatling
                        createEnemyLaser(boss.x - 65, boss.y - 20, 0, -6, 0x00e5ff, 12);
                        createEnemyLaser(boss.x + 65, boss.y - 20, 0, -6, 0x00e5ff, 12);
                    } else if (boss.phase === 2) {
                        // Sweeping Plasma Waves
                        const offset = (boss.attackTimer % 5 - 2) * 2;
                        createEnemyLaser(boss.x - 65, boss.y - 20, offset, -5.5, 0xff0055, 14);
                        createEnemyLaser(boss.x + 65, boss.y - 20, -offset, -5.5, 0xff0055, 14);
                    } else if (boss.phase === 3) {
                        // Triple Salvo Carpet Attack
                        for (let dir = -1; dir <= 1; dir++) {
                            createEnemyLaser(boss.x + dir * 50, boss.y - 10, dir * 2, -6, 0xffea00, 14);
                        }
                    }
                    boss.lastAttack = now;
                }

            // --- BOSS 3: COSMIC WEAVER BEHAVIOR ---
            } else if (boss.type === 2) {
                boss.x += Math.sin(now * 0.002) * 3;
                boss.y = 170 + Math.cos(now * 0.003) * 20;

                boss.group.position.set(boss.x, boss.y, 0);
                boss.coreMesh.rotation.x += 0.02;
                boss.coreMesh.rotation.y += 0.03;

                // Animate Orbiting Satellite Drones
                boss.droneAngle += 0.04;
                boss.drones.forEach((drone, idx) => {
                    const angle = boss.droneAngle + (idx * Math.PI * 2 / 3);
                    drone.position.set(Math.cos(angle) * 80, Math.sin(angle) * 80, 0);
                    drone.rotation.z += 0.05;
                });

                const healthRatio = boss.health / boss.maxHealth;
                if (healthRatio < 0.65 && boss.phase === 1) {
                    boss.phase = 2;
                    boss.innerMesh.material.color.setHex(0xff0055);
                    triggerExplosion(boss.x, boss.y, 0xff00aa, 70);
                } else if (healthRatio < 0.3 && boss.phase === 2) {
                    boss.phase = 3;
                    boss.innerMesh.material.color.setHex(0x00ffff);
                    triggerExplosion(boss.x, boss.y, 0x00ffff, 90);
                }

                if (now - boss.lastAttack > (boss.phase === 3 ? 450 : 800)) {
                    boss.attackTimer++;
                    if (boss.phase === 1) {
                        // Drone Directed Lasers
                        boss.drones.forEach(drone => {
                            const worldPos = new THREE.Vector3();
                            drone.getWorldPosition(worldPos);
                            const dx = player.x - worldPos.x;
                            const dy = player.y - worldPos.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            createEnemyLaser(worldPos.x, worldPos.y, (dx / dist) * 4.5, (dy / dist) * 4.5, 0x00e5ff, 10);
                        });
                    } else if (boss.phase === 2) {
                        // Radial 360 Blossom Wave
                        const count = 12;
                        for (let i = 0; i < count; i++) {
                            const angle = (i * Math.PI * 2 / count) + boss.droneAngle;
                            createEnemyLaser(boss.x, boss.y, Math.cos(angle) * 5, Math.sin(angle) * 5, 0xff00aa, 12);
                        }
                    } else if (boss.phase === 3) {
                        // High Speed Multi-Target Chaos Pulsing
                        const count = 8;
                        for (let i = 0; i < count; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            createEnemyLaser(boss.x, boss.y, Math.cos(angle) * 6, Math.sin(angle) * 6, 0xffff00, 12);
                        }
                    }
                    boss.lastAttack = now;
                }
            }
        }

        // --- Controls & Upgrades ---
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyM' && gameRunning) toggleUpgradeMenu(true);
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        restartBtn.addEventListener('click', restartGame);
        upgradeBtn.addEventListener('click', () => toggleUpgradeMenu(true));
        closeUpgradeBtn.addEventListener('click', () => toggleUpgradeMenu(false));

        document.querySelectorAll('.btn-upgrade').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = e.currentTarget.dataset.upgrade;
                buyUpgrade(type);
            });
        });

        function updateUpgradeButtons() {
            document.querySelectorAll('.btn-upgrade').forEach(btn => {
                const type = btn.dataset.upgrade;
                btn.disabled = score < upgrades[type].cost;
            });
        }

        function toggleUpgradeMenu(show) {
            upgradeMenu.style.display = show ? 'block' : 'none';
            gameRunning = !show;
            if (show) updateUpgradeButtons();
            else gameLoop();
        }

        function buyUpgrade(type) {
            const up = upgrades[type];
            if (score < up.cost) return;

            score -= up.cost;
            up.level++;
            totalUpgrades++;
            scoreEl.textContent = score;

            switch (type) {
                case 'firingSpeed':
                    bulletCooldown = Math.max(60, bulletCooldown - 25);
                    break;
                case 'health':
                    maxLives++;
                    lives = maxLives;
                    livesEl.innerHTML = '♥'.repeat(lives);
                    break;
                case 'movementSpeed':
                    player.speed += 1.2;
                    break;
                case 'bulletSpeed':
                    baseBulletSpeed += 2.5;
                    break;
                case 'shield':
                    shieldActive = true;
                    shieldEndTime = Date.now() + 5000;
                    break;
            }
            toggleUpgradeMenu(false);
        }

        function registerPlayerHit() {
            if (shieldActive) return;

            lives--;
            livesEl.innerHTML = '♥'.repeat(Math.max(0, lives));
            triggerExplosion(player.x, player.y, 0x00e5ff, 40);
            screenShakeTime = 15;

            if (lives <= 0) {
                gameRunning = false;
                finalScoreEl.textContent = score;
                gameOverModal.style.display = 'block';
            } else {
                // Temporary Invincibility
                shieldActive = true;
                shieldEndTime = Date.now() + 1500;
            }
        }

        function restartGame() {
            score = 0;
            lives = maxLives;
            livesEl.innerHTML = '♥'.repeat(lives);
            scoreEl.textContent = score;

            bullets.forEach(b => scene.remove(b.mesh));
            enemies.forEach(e => scene.remove(e.mesh));
            enemyBullets.forEach(b => scene.remove(b.mesh));

            bullets = [];
            enemies = [];
            enemyBullets = [];

            if (boss) {
                scene.remove(boss.group);
                boss = null;
            }

            player.x = 0;
            player.y = -220;
            shieldActive = false;
            currentBossType = 0;
            bossSpawned = false;
            nextBossSpawnTime = Date.now() + 25000;
            gameRunning = true;
            gameOverModal.style.display = 'none';
            gameLoop();
        }

        // --- Core Update Loop ---
        function update() {
            const now = Date.now();

            // Check Boss Sequence Trigger
            if (!boss && !bossSpawned && now > nextBossSpawnTime) {
                spawnBoss(currentBossType);
            }

            // Shield status
            if (shieldActive) {
                player.shieldMesh.visible = true;
                player.shieldMesh.rotation.z += 0.05;
                if (now > shieldEndTime) {
                    shieldActive = false;
                    player.shieldMesh.visible = false;
                }
            }

            // Player Movement Controls
            const isMovingUp = keys['ArrowUp'] || keys['KeyW'];
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (isMovingUp) player.y += player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y -= player.speed;

            // Screen Clamping
            player.x = Math.max(-BOUNDS.width / 2 + 25, Math.min(BOUNDS.width / 2 - 25, player.x));
            player.y = Math.max(-BOUNDS.height / 2 + 25, Math.min(BOUNDS.height / 2 - 25, player.y));

            player.mesh.position.set(player.x, player.y, 0);

            // --- ANIMATE PLAYER THRUSTERS & PARTICLES ---
            if (player.thrusterMesh) {
                const flicker = 0.8 + Math.random() * 0.5;
                const boostScale = isMovingUp ? 1.6 : 1.0;

                player.thrusterMesh.scale.set(flicker, flicker * boostScale, 1);
                player.innerFlameMesh.scale.set(flicker * 0.9, flicker * boostScale * 0.9, 1);

                // Spawn thruster particle trail
                if (Math.random() < (isMovingUp ? 0.8 : 0.4)) {
                    triggerExplosion(
                        player.x + (Math.random() - 0.5) * 6,
                        player.y - 26,
                        isMovingUp ? 0x00ffff : 0x0088ff,
                        2
                    );
                }
            }

            // Laser Shooting
            if (keys['Space'] && now - lastShotTime > bulletCooldown) {
                if (upgrades.multiShot.level > 0) {
                    createPlayerLaser(player.x - 12, player.y + 15, -1.5);
                    createPlayerLaser(player.x, player.y + 20, 0);
                    createPlayerLaser(player.x + 12, player.y + 15, 1.5);
                } else {
                    createPlayerLaser(player.x, player.y + 20, 0);
                }
                lastShotTime = now;
            }

            // Update Player Lasers
            bullets = bullets.filter(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.mesh.position.set(b.x, b.y, 0);

                if (b.y > BOUNDS.height / 2) {
                    scene.remove(b.mesh);
                    return false;
                }
                return true;
            });

            // Spawn Regular Enemy Waves
            if (!boss && Math.random() < 0.03) {
                const geo = new THREE.DodecahedronGeometry(16);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() < 0.2 ? 0xa855f7 : 0x22c55e });
                const mesh = new THREE.Mesh(geo, mat);
                const x = (Math.random() - 0.5) * (BOUNDS.width - 60);
                const y = BOUNDS.height / 2 + 20;

                mesh.position.set(x, y, 0);
                scene.add(mesh);

                enemies.push({
                    x, y, width: 32, height: 32,
                    speed: 2 + Math.random() * 2,
                    type: Math.random() < 0.2 ? 'special' : 'normal',
                    mesh,
                    lastShot: 0
                });
            }

            // Update Regular Enemies
            enemies = enemies.filter(enemy => {
                enemy.y -= enemy.speed;
                enemy.mesh.position.set(enemy.x, enemy.y, 0);
                enemy.mesh.rotation.x += 0.02;
                enemy.mesh.rotation.y += 0.02;

                if (totalUpgrades >= 1 && now - enemy.lastShot > enemyBulletCooldown) {
                    createEnemyLaser(enemy.x, enemy.y - 15, 0, -4, 0xff0055, 8);
                    enemy.lastShot = now;
                }

                if (enemy.y < -BOUNDS.height / 2 - 20) {
                    scene.remove(enemy.mesh);
                    return false;
                }
                return true;
            });

            // Update Enemy Lasers
            enemyBullets = enemyBullets.filter(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.mesh.position.set(b.x, b.y, 0);

                if (isColliding(b, player)) {
                    scene.remove(b.mesh);
                    registerPlayerHit();
                    return false;
                }

                if (Math.abs(b.x) > BOUNDS.width / 2 || Math.abs(b.y) > BOUNDS.height / 2) {
                    scene.remove(b.mesh);
                    return false;
                }
                return true;
            });

            if (boss) updateBoss();

            // Laser Collision Logic
            for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
                const b = bullets[bIdx];

                // Hit Regular Enemies
                for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    const e = enemies[eIdx];
                    if (isColliding(b, e)) {
                        triggerExplosion(e.x, e.y, e.type === 'special' ? 0xa855f7 : 0x22c55e, 20);
                        score += e.type === 'special' ? 100 : 25;
                        scoreEl.textContent = score;

                        scene.remove(b.mesh);
                        scene.remove(e.mesh);
                        bullets.splice(bIdx, 1);
                        enemies.splice(eIdx, 1);
                        break;
                    }
                }

                // Hit Boss
                if (boss && isColliding(b, boss)) {
                    boss.health -= 15;
                    triggerExplosion(b.x, b.y, 0xffea00, 5);
                    scene.remove(b.mesh);
                    bullets.splice(bIdx, 1);

                    if (boss.health <= 0) {
                        triggerExplosion(boss.x, boss.y, 0xff0055, 120);
                        score += 5000 + (boss.type * 2500);
                        scoreEl.textContent = score;

                        scene.remove(boss.group);
                        boss = null;

                        // Queue next boss sequence
                        currentBossType = (currentBossType + 1) % 3;
                        bossSpawned = false;
                        nextBossSpawnTime = Date.now() + 20000; // Next boss arrives in 20 seconds
                    }
                }
            }

            // Player Collision with Enemies or Boss
            if (!shieldActive) {
                enemies.forEach(e => {
                    if (isColliding(player, e)) registerPlayerHit();
                });
                if (boss && isColliding(player, boss)) registerPlayerHit();
            }

            // Starfield Motion
            const positions = starGeo.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i * 3 + 1] -= starSpeeds[i];
                if (positions[i * 3 + 1] < -BOUNDS.height / 2) {
                    positions[i * 3 + 1] = BOUNDS.height / 2;
                }
            }
            starGeo.attributes.position.needsUpdate = true;

            updateParticles();

            // Camera Screen Shake
            if (screenShakeTime > 0) {
                camera.position.x = (Math.random() - 0.5) * screenShakeTime * 0.8;
                camera.position.y = (Math.random() - 0.5) * screenShakeTime * 0.8;
                screenShakeTime--;
            } else {
                camera.position.x = 0;
                camera.position.y = 0;
            }
        }

        // --- Render Loop ---
        function gameLoop() {
            if (!gameRunning) return;
            update();
            composer.render();
            requestAnimationFrame(gameLoop);
        }

        // Start Game Engine
        gameLoop();
    </script>
</body>
