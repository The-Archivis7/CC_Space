<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure Game</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --accent: #00e5ff;
            --danger: #ff5252;
            --bg-glass: rgba(16, 24, 48, 0.85);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #030712;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            background: #02040a;
        }

        /* --- UI Overlay --- */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        #lives {
            color: var(--danger);
            letter-spacing: 2px;
        }

        button {
            pointer-events: auto;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ui {
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .btn-ui:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.7);
        }

        /* --- Overlays & Modals --- */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 24px 32px;
            color: white;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 10;
        }

        #game-over-modal h1 {
            color: var(--danger);
            margin: 0 0 10px 0;
            font-size: 42px;
            text-shadow: 0 0 15px rgba(255, 82, 82, 0.5);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 28px;
            font-size: 18px;
            margin-top: 15px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        #upgrade-menu h2 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .btn-upgrade {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .btn-upgrade:hover:not(:disabled) {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent);
        }

        .btn-upgrade:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cost-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="stats-group">
                <div class="stat-item">Score: <span id="score">0</span></div>
                <div class="stat-item">Lives: <span id="lives">♥♥♥</span></div>
            </div>
            <button id="upgrade-btn" class="btn-ui">Upgrades (M)</button>
        </div>

        <canvas id="game-canvas" width="800" height="600"></canvas>

        <div id="game-over-modal" class="modal">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart" class="btn-primary">Play Again</button>
        </div>

        <div id="upgrade-menu" class="modal">
            <h2>Hangar Upgrades</h2>
            <div class="upgrade-grid">
                <button class="btn-upgrade" data-upgrade="firingSpeed">
                    Firing Speed <span class="cost-tag">50 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="health">
                    +1 Extra Life <span class="cost-tag">100 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="movementSpeed">
                    Move Speed <span class="cost-tag">75 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="bulletSpeed">
                    Bullet Velocity <span class="cost-tag">80 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="shield">
                    Invincibility (5s) <span class="cost-tag">150 pts</span>
                </button>
                <button class="btn-upgrade" data-upgrade="multiShot">
                    Spread Shot <span class="cost-tag">200 pts</span>
                </button>
            </div>
            <button id="close-upgrade" class="btn-primary" style="width: 100%;">Resume Mission</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const upgradeMenu = document.getElementById('upgrade-menu');
        const closeUpgradeBtn = document.getElementById('close-upgrade');

        // State Management
        let score = 0;
        let lives = 3;
        let maxLives = 3;
        let gameRunning = true;
        let lastShotTime = 0;
        let bulletCooldown = 200;
        let enemyBulletCooldown = 2000;
        let totalUpgrades = 0;

        // Upgrade Levels
        const upgrades = {
            firingSpeed: { level: 0, cost: 50 },
            health: { level: 0, cost: 100 },
            movementSpeed: { level: 0, cost: 75 },
            bulletSpeed: { level: 0, cost: 80 },
            shield: { level: 0, cost: 150 },
            multiShot: { level: 0, cost: 200 }
        };

        // Player & Shield
        let shieldActive = false;
        let shieldEndTime = 0;
        let baseBulletSpeed = 7;

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 70,
            width: 50,
            height: 50,
            speed: 5
        };

        // Entities & Systems
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let boss = null;
        let gameStartTime = Date.now();
        const bossSpawnTime = 300000; // 5 mins
        let bossSpawned = false;
        const keys = {};

        // Generate Static Background Stars (Performance Optimization)
        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.8 + 0.2
        }));

        // Helper: Collision detection
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyM' && gameRunning) toggleUpgradeMenu(true);
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        restartBtn.addEventListener('click', restartGame);
        upgradeBtn.addEventListener('click', () => toggleUpgradeMenu(true));
        closeUpgradeBtn.addEventListener('click', () => toggleUpgradeMenu(false));

        // Upgrade Click Handler
        document.querySelectorAll('.btn-upgrade').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = e.currentTarget.dataset.upgrade;
                buyUpgrade(type);
            });
        });

        function updateUpgradeButtons() {
            document.querySelectorAll('.btn-upgrade').forEach(btn => {
                const type = btn.dataset.upgrade;
                btn.disabled = score < upgrades[type].cost;
            });
        }

        function toggleUpgradeMenu(show) {
            upgradeMenu.style.display = show ? 'block' : 'none';
            gameRunning = !show;
            if (show) {
                updateUpgradeButtons();
            } else {
                gameLoop();
            }
        }

        function buyUpgrade(type) {
            const up = upgrades[type];
            if (score < up.cost) return;

            score -= up.cost;
            up.level++;
            totalUpgrades++;
            scoreEl.textContent = score;

            switch (type) {
                case 'firingSpeed':
                    bulletCooldown = Math.max(50, bulletCooldown - 20);
                    break;
                case 'health':
                    maxLives++;
                    lives = maxLives;
                    livesEl.innerHTML = '♥'.repeat(lives);
                    break;
                case 'movementSpeed':
                    player.speed += 1;
                    break;
                case 'bulletSpeed':
                    baseBulletSpeed += 1.5;
                    break;
                case 'shield':
                    shieldActive = true;
                    shieldEndTime = Date.now() + 5000;
                    break;
            }
            toggleUpgradeMenu(false);
        }

        function restartGame() {
            score = 0;
            lives = maxLives;
            livesEl.innerHTML = '♥'.repeat(lives);
            scoreEl.textContent = score;
            bullets = [];
            enemies = [];
            enemyBullets = [];
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 70;
            shieldActive = false;
            boss = null;
            bossSpawned = false;
            gameStartTime = Date.now();
            gameRunning = true;
            gameOverModal.style.display = 'none';
            gameLoop();
        }

        // --- Boss Logic ---
        function spawnBoss() {
            enemies = [];
            enemyBullets = [];
            boss = {
                x: canvas.width / 2 - 100,
                y: 50,
                width: 200,
                height: 80,
                health: 2000,
                maxHealth: 2000,
                color: '#e11d48',
                originalColor: '#e11d48',
                attackPattern: 'spread',
                lastAttackTime: Date.now(),
                attackCooldown: 1000,
                attackPhaseTimer: 0
            };
        }

        function updateBoss() {
            if (!boss) return;
            const currentTime = Date.now();

            if (currentTime - boss.lastAttackTime > boss.attackCooldown) {
                const fireSpread = (count, speed) => {
                    const startAngle = -Math.PI / 4;
                    const angleStep = (Math.PI / 2) / (count - 1);
                    for (let i = 0; i < count; i++) {
                        const angle = startAngle + (angleStep * i);
                        enemyBullets.push({
                            x: boss.x + boss.width / 2,
                            y: boss.y + boss.height,
                            width: 8, height: 8,
                            velX: Math.sin(angle) * speed,
                            velY: Math.cos(angle) * speed,
                            color: '#fbbf24'
                        });
                    }
                };

                if (boss.attackPattern === 'spread') {
                    fireSpread(5, 5);
                    if (++boss.attackPhaseTimer > 3) {
                        boss.attackPattern = 'pause';
                        boss.attackPhaseTimer = 0;
                        boss.attackCooldown = 2500;
                    }
                } else if (boss.attackPattern === 'pause') {
                    boss.attackPattern = 'spread2';
                    boss.attackCooldown = 1500;
                } else if (boss.attackPattern === 'spread2') {
                    fireSpread(9, 4.5);
                    if (++boss.attackPhaseTimer > 5) {
                        boss.attackPattern = 'pause2';
                        boss.attackPhaseTimer = 0;
                        boss.attackCooldown = 3000;
                    }
                } else if (boss.attackPattern === 'pause2') {
                    boss.attackPattern = 'spread';
                    boss.attackCooldown = 1500;
                }
                boss.lastAttackTime = currentTime;
            }
        }

        // --- Core Updates ---
        function update() {
            const currentTime = Date.now();

            // Boss Check
            if (!boss && !bossSpawned && (currentTime - gameStartTime > bossSpawnTime)) {
                spawnBoss();
                bossSpawned = true;
            }

            // Shield status
            if (shieldActive && currentTime > shieldEndTime) {
                shieldActive = false;
            }

            // Controls
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            // Clamp Player
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // Firing
            if (keys['Space'] && currentTime - lastShotTime > bulletCooldown) {
                const createBullet = (offsetX) => ({
                    x: player.x + player.width / 2 + offsetX - 2,
                    y: player.y,
                    width: 4, height: 12,
                    speed: baseBulletSpeed
                });

                if (upgrades.multiShot.level > 0) {
                    bullets.push(createBullet(-12), createBullet(0), createBullet(12));
                } else {
                    bullets.push(createBullet(0));
                }
                lastShotTime = currentTime;
            }

            // Entity Motion & Cleanups
            bullets = bullets.filter(b => (b.y -= b.speed) > 0);

            if (!boss && Math.random() < 0.025) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -40, width: 36, height: 36,
                    speed: 2 + Math.random() * 2,
                    type: Math.random() < 0.15 ? 'special' : 'normal',
                    lastShotTime: 0
                });
            }

            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                if (totalUpgrades >= 1 && currentTime - enemy.lastShotTime > enemyBulletCooldown) {
                    enemyBullets.push({
                        x: enemy.x + enemy.width / 2 - 2, y: enemy.y + enemy.height,
                        width: 4, height: 10, velX: 0, velY: 4, color: '#ff4444'
                    });
                    enemy.lastShotTime = currentTime;
                }
                return enemy.y < canvas.height;
            });

            if (boss) updateBoss();

            enemyBullets = enemyBullets.filter(b => {
                b.x += b.velX || 0;
                b.y += b.velY || b.speed;
                return b.y < canvas.height && b.y > -b.height && b.x > -b.width && b.x < canvas.width;
            });

            // Collisions
            for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
                const b = bullets[bIdx];

                for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    const e = enemies[eIdx];
                    if (isColliding(b, e)) {
                        bullets.splice(bIdx, 1);
                        enemies.splice(eIdx, 1);
                        score += e.type === 'special' ? 100 : 25;
                        scoreEl.textContent = score;
                        break;
                    }
                }

                if (boss && isColliding(b, boss)) {
                    bullets.splice(bIdx, 1);
                    boss.health -= 10;
                    boss.color = '#ffffff';
                    setTimeout(() => { if (boss) boss.color = boss.originalColor; }, 40);

                    if (boss.health <= 0) {
                        score += 5000;
                        scoreEl.textContent = score;
                        boss = null;
                    }
                }
            }

            // Player Damage Logic
            if (!shieldActive) {
                const registerHit = () => {
                    lives--;
                    livesEl.innerHTML = '♥'.repeat(Math.max(0, lives));
                    if (lives <= 0) {
                        gameRunning = false;
                        finalScoreEl.textContent = score;
                        gameOverModal.style.display = 'block';
                    }
                };

                // Check Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (isColliding(player, enemies[i])) {
                        enemies.splice(i, 1);
                        registerHit();
                    }
                }

                // Check Enemy Bullets
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    if (isColliding(player, enemyBullets[i])) {
                        enemyBullets.splice(i, 1);
                        registerHit();
                    }
                }

                // Check Boss
                if (boss && isColliding(player, boss)) {
                    registerHit();
                    if (gameRunning) {
                        player.y = boss.y + boss.height + 25;
                        shieldActive = true;
                        shieldEndTime = Date.now() + 1000;
                    }
                }
            }
        }

        // --- Render Engine ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Dynamic Starfield
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            // Shield Visual Effect
            if (shieldActive) {
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00e5ff';
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width / 2 + 12, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Player Spacecraft
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height * 0.75);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Player Bullets
            ctx.fillStyle = '#facc15';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Enemy Bullets
            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Enemies
            enemies.forEach(e => {
                const cx = e.x + e.width / 2;
                const cy = e.y + e.height / 2;

                if (e.type === 'special') {
                    ctx.fillStyle = '#a855f7';
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                } else {
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.arc(cx, cy, e.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.arc(cx + 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Boss Render
            if (boss) {
                ctx.fillStyle = boss.color;
                ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

                // Boss Health Bar UI
                const hbY = boss.y - 18;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(boss.x, hbY, boss.width, 8);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(boss.x, hbY, boss.width * (boss.health / boss.maxHealth), 8);
            }
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize Game
        gameLoop();
    </script>
</body>
</html>
